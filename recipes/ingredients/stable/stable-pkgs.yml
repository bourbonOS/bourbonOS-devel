type: dnf
source: ghcr.io/blue-build/modules/dnf:dnf-module
repos:
  files:
    - bourbon-os-stable.repo
install:
  packages:
    - atuin
    - util-linux
    - topgrade
    - distrobox
    - firefox
    - rsync
    - unzip
    - alsa-sof-firmware
    - iwlwifi-mvm-firmware
    - iwlwifi-dvm-firmware
    - iwlegacy-firmware
    - plymouth 
    - plymouth-theme-spinner
remove:
  packages:
    - toolbox
    - sudo
    - sudo-python-plugin
    - PackageKit
    - PackageKit-command-not-found
