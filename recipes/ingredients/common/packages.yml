type: dnf
repos:
  copr:
    enable:
      - chronos/main
install:
  packages:
    - atuin
    - distrobox
    - chromium
    - unzip
    - alsa-sof-firmware
    - iwlwifi-mvm-firmware
    - iwlwifi-dvm-firmware
    - iwlegacy-firmware
    - plymouth 
    - plymouth-theme-spinner
    - pamtester
remove:
  packages:
    - toolbox
    - sudo
    - sudo-python-plugin
    - PackageKit
    - PackageKit-command-not-found
